name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Found a security vulnerability? Please report it privately instead (see SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API (FastAPI)
        - Input sanitizer and taint tracker (SC1)
        - OPA policies (SC2)
        - Data pipeline (data/)
        - Attack simulator (Streamlit)
        - Docker services
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make up` and `make dev`
        2. Send POST /api/v1/ingest with ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, Python 3.12, Docker 27
