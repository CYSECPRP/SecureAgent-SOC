version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /attack_simulator
    schedule:
      interval: weekly
    # The lock files are compiled for Python 3.12; move to a new Python version on purpose, not by bot.
    ignore:
      - dependency-name: python
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
