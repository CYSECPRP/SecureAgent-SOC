name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The datasets are stored with Git LFS and are not needed for the tests.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Start PostgreSQL, Redis, Qdrant and OPA
        run: docker compose up -d --wait postgres redis qdrant opa

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create database tables
        working-directory: backend
        run: |
          python - <<'EOF'
          import asyncio

          from src.knowledge.db import engine, init_db


          async def main():
              await init_db()
              await engine.dispose()


          asyncio.run(main())
          EOF

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
