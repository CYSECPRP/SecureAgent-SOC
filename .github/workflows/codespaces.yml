name: Codespaces

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "backend/requirements.txt"
      - "attack_simulator/requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/codespaces.yml"
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "backend/requirements.txt"
      - "attack_simulator/requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/codespaces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    name: Dev container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Build the dev container and check it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: secureagent-soc-devcontainer
          push: never
          runCmd: |
            set -euo pipefail
            .venv/bin/python -c "import fastapi, streamlit; print('packages installed')"
            head -c 1 data/splits/evaluation/agentdojo_adversarial_injections.jsonl | grep -q '{'
            test "$(docker compose ps --status running --services | sort | tr '\n' ' ')" = "opa postgres qdrant redis "
